name: Sync upstream VoiceStudio

on:
  workflow_dispatch:
  push:
    branches: [main, upstream-sync]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into sync branch
        id: sync
        env:
          UPSTREAM_URL: https://github.com/debpalash/VoiceStudio.git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-upstream.sh

      - name: Validate the sync branch
        if: steps.sync.outputs.changed == 'true'
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref upstream-sync --field scope=gemini-windows
          gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref upstream-sync --field scope=gemini-windows

          find_run() {
            local workflow="$1"
            local run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch upstream-sync \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" \
                | head -n 1)"
              if [[ -n "$run_id" ]]; then
                echo "$run_id"
                return 0
              fi
              sleep 2
            done
            echo "Could not find the dispatched $workflow run for $TARGET_SHA." >&2
            return 1
          }

          CI_RUN="$(find_run ci.yml)"
          SECURITY_RUN="$(find_run security.yml)"
          gh run watch "$CI_RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run watch "$SECURITY_RUN" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Promote validated upstream sync to main
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main
          git push origin --delete upstream-sync
          # Pushes made with GITHUB_TOKEN intentionally do not start another
          # workflow. Dispatch the rolling installer explicitly so the public
          # MSI always matches the newly promoted main branch.
          gh workflow run gemini-windows-msi.yml --repo "$GITHUB_REPOSITORY" --ref main
