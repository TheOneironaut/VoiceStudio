name: Gemini Windows MSI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "omnivoice/**"
      - "electron/**"
      - "frontend/package.json"
      - "package.json"
      - "bun.lock"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gemini-windows-msi.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "omnivoice/**"
      - "electron/**"
      - "frontend/package.json"
      - "package.json"
      - "bun.lock"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/gemini-windows-msi.yml"

permissions:
  contents: write

concurrency:
  group: gemini-windows-msi-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VOICESTUDIO_EDITION: gemini
  VOICESTUDIO_RUST_TARGET: x86_64-pc-windows-msvc
  VOICESTUDIO_UPDATE_CHANNEL: gemini-disabled-win32-x64
  RELEASE_TAG: gemini-windows
  MSI_NAME: VoiceStudio-Gemini-Windows-x64.msi
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: Build and publish Gemini Electron MSI
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.VOICESTUDIO_RUST_TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/desktop-bridge -> target
          key: gemini-electron-${{ env.VOICESTUDIO_RUST_TARGET }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Bundle pinned uv for Electron
        shell: pwsh
        run: |
          $source = (Get-Command uv).Source
          $destination = "electron/build/uv/uv-$env:VOICESTUDIO_RUST_TARGET.exe"
          New-Item -ItemType Directory -Force (Split-Path $destination -Parent) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Validate Electron
        run: bun run check:electron

      - name: Build Gemini Electron MSI
        working-directory: electron
        run: |
          bun x electron-builder --config electron-builder.gemini-windows.config.mjs --win msi --x64 --publish never
          node tests/gemini-windows-package-contract.mjs --artifact

      - name: Install managed runtime and verify Gemini default
        working-directory: electron
        timeout-minutes: 25
        env:
          VOICESTUDIO_PACKAGED_EXE: electron/release/win-unpacked/VoiceStudio Gemini.exe
          VOICESTUDIO_EXPECTED_TTS_ENGINE: gemini-3.1-flash-tts
          VOICESTUDIO_RUNTIME_TIMEOUT_MS: "1200000"
        run: node tests/packaged-smoke.mjs --install

      - name: Stage rolling MSI
        shell: pwsh
        run: |
          $msi = "electron/release/$env:MSI_NAME"
          if (-not (Test-Path -LiteralPath $msi)) { throw "Electron did not produce $msi" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath $msi -Destination "dist/$env:MSI_NAME"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$env:MSI_NAME").Hash.ToLowerInvariant()
          "$hash  $env:MSI_NAME" | Set-Content -Encoding ascii "dist/$env:MSI_NAME.sha256"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-electron-windows-${{ github.run_id }}
          path: |
            electron/release/*.msi
            electron/release/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish rolling Gemini release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows Electron installer for the Gemini-default VoiceStudio build from commit $env:GITHUB_SHA. Existing engine preferences are preserved; new installations default to Gemini 3.1 Flash TTS and do not download a local TTS checkpoint."
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "VoiceStudio Gemini for Windows" --notes $notes
          } else {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title "VoiceStudio Gemini for Windows" --notes $notes
          }
          gh release upload $env:RELEASE_TAG "dist/$env:MSI_NAME" "dist/$env:MSI_NAME.sha256" --clobber --repo $env:GITHUB_REPOSITORY
